services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4318
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      - otel-collector
      - redis
      - postgres
      - minio
    networks:
      - observability

  minio:
    image: minio/minio:latest
    container_name: event-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - observability

  postgres:
    image: postgres:15
    container_name: event-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - observability

  redis:
    image: redis:7
    container_name: event-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - observability

  prometheus:
    image: prom/prometheus
    container_name: event-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: event-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: event-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - observability

  promtail:
    image: grafana/promtail:latest
    container_name: event-promtail
    volumes:
      - ./logs:/var/log/app
      - ./promtail.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    container_name: event-tempo
    user: root
    command: ["-config.file=/etc/tempo.yaml", "-target=all"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: event-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - tempo
      - loki
    networks:
      - observability

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  tempo_data:
  minio_data:

networks:
  observability:
    driver: bridge